.field-hero{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:15px}.field-hero .ticket-id{font-size:11px;color:#6d28d9;font-weight:800;letter-spacing:.04em}.field-kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.field-kv>div{background:#f8f9fb;border-radius:11px;padding:9px}.field-kv .small{margin-bottom:2px}.field-status{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;background:#eefbf5;color:#08734f;font-size:10px;font-weight:800}.field-choice{border:1px solid #e2e5eb;background:#fff;border-radius:12px;padding:11px;text-align:left;width:100%;cursor:pointer}.field-choice.selected{border-color:#625bd4;background:#f7f6ff;box-shadow:0 0 0 2px #625bd41a}.field-choice b{font-size:12px}.field-choice .small{margin-top:3px}.field-sticky{position:sticky;bottom:0;background:linear-gradient(transparent,#f7f8fb 18%);padding-top:15px;margin-top:4px}.field-meta{display:flex;justify-content:space-between;gap:8px;align-items:center}.field-photo-mini{height:105px;border-radius:12px;background:linear-gradient(145deg,#64748b,#cbd5e1 50%,#475569);position:relative;overflow:hidden}.field-photo-mini:after{content:'SITE PHOTO';position:absolute;right:9px;bottom:8px;color:#fff;font-size:9px;font-weight:800;letter-spacing:1px}.field-complete{border:1px solid #cde9dc;background:#f3fbf7;border-radius:12px;padding:11px}.field-alert{border:1px solid #fed7aa;background:#fff8ef;border-radius:12px;padding:11px;color:#9a4e08}
</style>
<script id="ground-team-ux-v2-js">
(function(){
  const TEAM=()=>state.assignedTeam||"Roads Crew · West 02";
  const resetGT=()=>{
    state.fieldStep=1; state.fieldArrived=false; state.workCompleted=false;
    state.workNote=""; state.fieldComment=""; state.evidenceAdded=false;
  };
  window.fieldDetail=function(){
    state.screen="detail";
    if(!state.fieldStep) resetGT();
    render();
  };
  window.goToFieldLocation=function(){
    state.fieldStep=2; state.caseStatus="Visit in progress"; render();
    notify("Visit started · Navigate to the reported location");
  };
  window.verifyFieldLocation=function(){
    state.fieldArrived=true; state.caseStatus="On site"; render();
    notify("✓ Location confirmed · GPS captured");
  };
  window.markFieldWork=function(note){
    state.workCompleted=true; state.workNote=note; state.caseStatus="Work recorded"; render();
    notify("✓ Field work recorded");
  };
  window.captureFieldPhoto=function(){
    state.evidenceAdded=true; state.caseStatus="Evidence captured"; render();
    notify("✓ Photo attached · GPS + timestamp added");
  };
  window.removeFieldPhoto=function(){state.evidenceAdded=false;render();notify("Photo removed")};
  window.goFieldSubmit=function(){
    const el=document.getElementById("fieldComment"); if(el) state.fieldComment=el.value.trim();
    if(!state.workCompleted){notify("Choose the field work outcome first");return}
    if(!state.evidenceAdded){notify("Add at least one site photo");return}
    state.fieldStep=4; render();
  };
  window.submitFieldReport=function(){
    const el=document.getElementById("fieldComment"); if(el) state.fieldComment=el.value.trim();
    if(!state.workCompleted){notify("Choose the field work outcome first");return}
    if(!state.evidenceAdded){notify("Add at least one site photo");return}
    state.verified=true; state.caseStatus="Field Report Submitted"; state.fieldStep=4;
    state.persona=2; state.screen="case"; render();
    notify("✓ Field report submitted · Department Officer notified");
  };
  window.fieldOutcome=function(note){markFieldWork(note)};

  function progress(active){
    const labels=["Review","Visit","Work + evidence","Submit"];
    return `<div class="field-progress">${labels.map((x,i)=>{
      const n=i+1, cls=active===n?'active':active>n?'done':'';
      return `<div class="fp"><div class="line ${cls}"></div><div class="lbl ${cls}">${active>n?'✓ ':''}${x}</div></div>`
    }).join('')}</div>`;
  }
  function ticketCard(){
    return `<div class="field-hero">
      <div class="field-meta"><div class="ticket-id">CGMS-2026-10482</div><span class="status high">HIGH · SLA 5:00 PM</span></div>
      <h3 style="margin:9px 0 3px">Pothole near ZP School</h3>
      <div class="small">Road damage · Thane West</div>
      <div class="field-kv">
        <div><div class="small">Assigned team</div><b>${esc(TEAM())}</b></div>
        <div><div class="small">Priority</div><b>High · 2h remaining</b></div>
      </div>
    </div>`;
  }
  window.fieldApp=function(){
    if(state.screen==="detail") return fieldDetailScreen();
    return mobile(`
      <div class="small">GROUND OPERATIONS</div>
      <div style="display:flex;justify-content:space-between;align-items:end">
        <div><h2 style="margin:4px 0 3px">Today's work</h2><div class="small">${state.assignedTeam?esc(state.assignedTeam):'Roads Crew · West 02'} · 3 assigned</div></div>
        <span class="field-status">● 1 priority</span>
      </div>
      <div class="card action-emphasis" style="margin-top:14px" onclick="fieldDetail()">
        <div class="field-meta"><span class="status high">HIGH PRIORITY</span><span class="small">Due 5:00 PM</span></div>
        <h3 style="margin:10px 0 3px">CGMS-2026-10482</h3>
        <div class="small">Pothole · Near ZP School, Thane West</div>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><span class="chip">Roads & Engineering</span><span class="chip">${esc(TEAM())}</span></div>
        <button class="mobile-action" style="margin-top:13px" onclick="event.stopPropagation();fieldDetail()">Open priority ticket →</button>
      </div>
      <div class="small" style="margin:18px 2px 8px">Later today</div>
      <div class="card"><div class="field-meta"><b>CGMS-2026-10471</b><span class="status progress">Scheduled</span></div><div class="small" style="margin-top:5px">Streetlight issue · Wagle Estate</div></div>
      <div class="card" style="margin-top:9px"><div class="field-meta"><b>CGMS-2026-10465</b><span class="status progress">Scheduled</span></div><div class="small" style="margin-top:5px">Drainage blockage · Kopri</div></div>
      <div class="card" style="margin-top:12px"><div class="field-meta"><b>Route progress</b><span class="small">0 / 3 completed</span></div><div class="bar" style="margin-top:9px"><i style="width:${state.verified?33:0}%"></i></div><div class="small" style="margin-top:7px">Complete the priority visit first.</div></div>
    `);
  };

  function fieldDetailScreen(){
    if(!state.fieldStep) resetGT();
    if(state.fieldStep===1) return mobile(`
      <div class="small">FIELD TASK · REVIEW</div><h2 style="margin:4px 0 3px">Before you leave</h2><div class="small">One quick check, then start the visit.</div>
      ${progress(1)}${ticketCard()}
      <div class="card" style="margin-top:11px"><b>What the citizen reported</b><div style="font-size:13px;line-height:1.5;margin-top:6px">Large pothole on the main road, dangerous for two-wheelers at night.</div><div class="small" style="margin-top:10px">Reported pin · Near ZP School, Thane West</div></div>
      <div class="field-sticky"><button class="mobile-action" onclick="goToFieldLocation()">Start visit & navigate →</button></div>
    `);

    if(state.fieldStep===2) return mobile(`
      <div class="small">FIELD TASK · VISIT</div><h2 style="margin:4px 0 3px">Get to the site</h2><div class="small">Navigate first. Confirm arrival only when you are physically there.</div>
      ${progress(2)}${ticketCard()}
      <div class="card" style="margin-top:11px">
        <div class="field-meta"><div><b>📍 Reported location</b><div class="small">Near ZP School, Thane West</div></div><span class="status progress">18 m away</span></div>
        <div class="map" style="height:170px;margin-top:11px"><i class="pin p2"></i></div>
        ${state.fieldArrived?`<div class="field-complete" style="margin-top:10px"><b>✓ You are at the reported location</b><div class="small" style="margin-top:3px">GPS captured · within 18 m of citizen pin</div></div><button class="mobile-action" style="margin-top:10px" onclick="state.fieldStep=3;state.caseStatus='On site';render()">Start field work →</button>`:`<div class="grid g2" style="margin-top:10px"><button class="btn" onclick="notify('Navigation opened in demo')">⌖ Navigate</button><button class="btn primary" onclick="verifyFieldLocation()">✓ I am here</button></div>`}
      </div>
    `);

    if(state.fieldStep===3) return mobile(`
      <div class="small">FIELD TASK · ON SITE</div><h2 style="margin:4px 0 3px">Do the work & capture proof</h2><div class="small">Record the outcome, add a site photo, then review.</div>
      ${progress(3)}${ticketCard()}
      <div class="card" style="margin-top:11px">
        <div class="field-status">● ON SITE · GPS verified</div>
        <div style="margin-top:12px"><b>What did you do?</b><div class="small" style="margin-top:3px">Choose the outcome that best describes this visit.</div></div>
        <div style="display:grid;gap:7px;margin-top:9px">
          <button class="field-choice ${state.workNote==='Work completed on site'?'selected':''}" onclick="fieldOutcome('Work completed on site')"><b>${state.workNote==='Work completed on site'?'●':'○'} Work completed on site</b><div class="small">Issue fixed during this visit</div></button>
          <button class="field-choice ${state.workNote==='Temporary safety action'?'selected':''}" onclick="fieldOutcome('Temporary safety action')"><b>${state.workNote==='Temporary safety action'?'●':'○'} Temporary safety action</b><div class="small">Barricading / immediate safety measure</div></button>
          <button class="field-choice ${state.workNote==='Inspection only'?'selected':''}" onclick="fieldOutcome('Inspection only')"><b>${state.workNote==='Inspection only'?'●':'○'} Inspection only</b><div class="small">Issue needs another crew or follow-up</div></button>
        </div>
      </div>
      <div class="card" style="margin-top:10px">
        <div class="field-meta"><div><b>Site evidence</b><div class="small">Photo is automatically GPS + time stamped</div></div>${state.evidenceAdded?'<span class="field-status">✓ Attached</span>':''}</div>
        ${state.evidenceAdded?`<div class="field-photo-mini" style="margin-top:10px"></div><div class="small" style="margin-top:6px">Captured 2:38 PM · GPS match 18 m · 3.2 MB</div><div class="grid g2" style="margin-top:8px"><button class="btn" onclick="captureFieldPhoto()">＋ Retake</button><button class="btn" onclick="removeFieldPhoto()">Remove</button></div>`:`<button class="btn action-emphasis" style="width:100%;margin-top:10px" onclick="captureFieldPhoto()">📷 Capture site photo</button>`}
        <label class="small" style="display:block;margin-top:12px"><b>Optional field note</b></label>
        <textarea id="fieldComment" class="form-field" style="height:64px;margin-top:5px;resize:none" placeholder="Add a short note for the officer...">${esc(state.fieldComment||'')}</textarea>
      </div>
      <div class="field-sticky"><button class="mobile-action" onclick="goFieldSubmit()" ${state.workCompleted&&state.evidenceAdded?'':'style="opacity:.48"'}>Review report →</button><div class="small" style="text-align:center;margin-top:6px">${!state.workCompleted?'Select a work outcome':!state.evidenceAdded?'Add one site photo':'Ready for review'}</div></div>
    `);

    return mobile(`
      <div class="small">FIELD TASK · FINAL CHECK</div><h2 style="margin:4px 0 3px">Review field report</h2><div class="small">Check the record before sending it back to the department officer.</div>
      ${progress(4)}
      <div class="field-complete"><b>Ready to submit</b><div class="small" style="margin-top:3px">All required field information is captured.</div></div>
      <div class="card" style="margin-top:11px">
        <div class="field-meta"><b>CGMS-2026-10482</b><span class="status done">Complete</span></div>
        <div class="field-kv">
          <div><div class="small">Arrival</div><b>✓ GPS verified</b></div>
          <div><div class="small">Work</div><b>✓ ${esc(state.workNote)}</b></div>
        </div>
        <div style="margin-top:11px"><div class="small">Evidence</div><b>✓ 1 GPS-tagged site photo</b></div>
        <div style="margin-top:11px"><div class="small">Field note</div><div style="font-size:13px;line-height:1.45">${esc(state.fieldComment||'No additional note added.')}</div></div>
      </div>
      <div class="card" style="margin-top:10px"><div class="small">After submission</div><b>Department Officer will review the field report.</b><div class="small" style="margin-top:4px">The citizen remains informed through the case timeline.</div></div>
      <div class="field-sticky"><button class="mobile-action" onclick="submitFieldReport()">Submit for resolution ✓</button><button class="btn" style="width:100%;margin-top:8px" onclick="state.fieldStep=3;render()">← Edit field report</button></div>
    `);
  }

  /* Make the demo guide match the actual field decision sequence. */
  const priorContext=window.contextualNext;
  window.contextualNext=function(){
    if(state.persona===3){
      if(state.screen==='tasks') return `<div class="next-action"><div><b>Next: open the priority ticket</b><div class="small">Review the assignment and start the visit.</div></div><button class="btn primary" onclick="fieldDetail()">Open ticket →</button></div>`;
      if(state.screen==='detail'){
        let title,desc,action,label;
        if(state.fieldStep===1){title='Start the site visit';desc='Review the ticket, then navigate to the reported location.';action='goToFieldLocation()';label='Start visit';}
        else if(state.fieldStep===2 && !state.fieldArrived){title='Confirm arrival when you reach site';desc='Navigate to the pin, then capture your GPS position.';action='verifyFieldLocation()';label='I am here';}
        else if(state.fieldStep===2){title='Begin field work';desc='You are on site. Record the outcome and capture proof.';action="state.fieldStep=3;render()";label='Start work';}
        else if(state.fieldStep===3 && !state.workCompleted){title='Record the field outcome';desc='Choose what happened during the visit.';action="fieldOutcome('Work completed on site')";label='Record work';}
        else if(state.fieldStep===3 && !state.evidenceAdded){title='Capture site evidence';desc='Attach at least one GPS-tagged photo.';action='captureFieldPhoto()';label='Add photo';}
        else if(state.fieldStep===3){title='Review the field report';desc='Check the work, photo and note before submitting.';action='goFieldSubmit()';label='Review report';}
        else {title='Submit the field report';desc='Send the completed visit back to the department officer.';action='submitFieldReport()';label='Submit';}
        return `<div class="next-action"><div><b>Next: ${title}</b><div class="small">${desc}</div></div><button class="btn primary action-emphasis" onclick="${action}">${label} →</button></div>`;
      }
    }
    return priorContext?priorContext():'';
  };
})();
</script>
